server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:3000; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
