openapi: 3.1.0
info:
  title: Estateably Finance API — feature 003 amendment
  version: 1.2.0
  description: |
    FROZEN with the feature 003 plan. The first Foundational task merges every fragment below,
    unedited, into the canonical specs/001-personal-finance-manager/contracts/openapi.yaml at
    the position named for it, and sets that file's info.version to 1.2.0.

    One operation changes its success response; nothing else changes:
      1. paths./reports/similar/narrative.post is replaced by the fragment below: same
         operationId, request body and error responses; description and 200 response rewritten.
      2. components.schemas.NarrativeResponse is removed (its only user was item 1).
      3. components.schemas gains NarrativeDeltaEvent and NarrativeEndEvent, inserted where
         NarrativeResponse was (before AiStatusResponse).
    Every $ref below resolves inside the canonical file.

paths:
  /reports/similar/narrative:
    post:
      operationId: generateSimilarNarrative
      tags: [reports]
      summary: AI narrative over the similar-transaction report, streamed
      description: >
        Sends the same grouped data to the configured LLM provider, with each description
        stripped of Markdown and HTML marks and line breaks, and streams back a short Markdown
        summary (one bullet per group, largest first, at most 10, the most expensive in bold) as
        Server-Sent Events. Requires `LLM_API_KEY`; without it the answer is `422 AI_NOT_CONFIGURED`.
        The provider is called once and never retried.


        **Before any text** the status line is not yet sent, so failures keep their JSON error
        responses: a provider rate limit `503 AI_RATE_LIMITED`, any other provider failure or an
        answer with no text `502 AI_PROVIDER_ERROR`, and no text within `LLM_TIMEOUT_MS`
        `504 AI_TIMEOUT`, counted from the provider call. Text means at least one
        non-whitespace character.


        **Once text flows** the answer is `200 text/event-stream`. Each event has one JSON
        `data` line. `event: delta` carries a `NarrativeDeltaEvent`, in the order the provider
        produced them; concatenating every `text` gives the narrative. `event: end` carries a
        `NarrativeEndEvent` and is always the last event. A failure after the first delta, a gap
        longer than `LLM_TIMEOUT_MS` between deltas, or reaching the output cap ends the stream
        with `outcome: incomplete` and a `reason`. There is no overall time limit. A body that
        closes without an `end` event means the connection was lost; clients treat it as
        incomplete.


        Closing the connection ends the provider request. The deterministic report is never
        affected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NarrativeRequest' }
      responses:
        '200':
          description: >
            The narrative as Server-Sent Events: zero or more `delta` events, then one `end`
            event. See `NarrativeDeltaEvent` and `NarrativeEndEvent`.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: delta
                data: {"text":"You spent $412.30 in September.\n\n- **Rent"}

                event: delta
                data: {"text":": $300.00 (1)**\n- Uber: $87.00 (3)\n"}

                event: end
                data: {"outcome":"complete"}
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/AiNotConfigured' }
        '502': { $ref: '#/components/responses/AiProviderError' }
        '503': { $ref: '#/components/responses/AiRateLimited' }
        '504': { $ref: '#/components/responses/AiTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    NarrativeDeltaEvent:
      type: object
      additionalProperties: false
      required: [text]
      description: '`data` of an `event: delta`. The next piece of the narrative, in order.'
      properties:
        text:
          type: string
          minLength: 1
          description: Markdown text to append to what arrived before.
          example: '- **Rent'
    NarrativeEndEvent:
      type: object
      additionalProperties: false
      required: [outcome]
      description: >
        `data` of the `event: end` that closes every stream. `reason` is present exactly when
        `outcome` is `incomplete`.
      properties:
        outcome:
          type: string
          enum: [complete, incomplete]
          example: complete
        reason:
          type: string
          enum: [provider_error, timeout, length]
          description: >
            `provider_error`: the provider failed or stopped for any reason other than finishing
            or the cap. `timeout`: no text for `LLM_TIMEOUT_MS`. `length`: the output cap was
            reached.
          example: timeout
      if:
        properties: { outcome: { const: incomplete } }
      then:
        required: [reason]
      else:
        not: { required: [reason] }
